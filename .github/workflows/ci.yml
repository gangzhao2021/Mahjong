name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build admin dashboard
        run: pnpm admin:build

      # Bundling catches what typecheck and tests can't, e.g. a require() of a missing sound or image.
      - name: Bundle the app (web, iOS, Android)
        run: pnpm --dir apps/mobile exec expo export --platform web --platform ios --platform android --output-dir "$RUNNER_TEMP/app"

  # The real image on real PostgreSQL: a coin game, a restart mid-game, ledger and history.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ID_HASH_SECRET=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --build

      - name: Check the deployment
        run: pnpm --filter @mahjong/server smoke:deploy --restart "docker compose restart server"

      - name: Server logs
        if: failure()
        run: docker compose logs server
