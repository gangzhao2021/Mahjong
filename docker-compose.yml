# Production-like stack: game server + PostgreSQL. Copy .env.example to .env first.
#   docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahjong
      POSTGRES_USER: mahjong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjong"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://mahjong:${POSTGRES_PASSWORD}@db:5432/mahjong
    ports:
      - "8787:8787"
    volumes:
      - serverdata:/data
    # Give the server time to checkpoint games in progress on shutdown.
    stop_grace_period: 20s

volumes:
  pgdata:
  serverdata:
